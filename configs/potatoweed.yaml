dataset_name: PotatoWeed
num_classes: 3
num_channels: 3
kernels: [16, 32, 48, 64, 256]
image_size: 288
test_image_size: 288
batch_size: 10
test_batch_size: 10
epochs: 150
learning_rate: 0.001
weight_decay: 0
loss_function: focal_loss
use_flip_augmentation: true
image_mode: auto
mask_mode: pil
test_l2_norm: false
train_image_dir: /Potato_Weed_Dataset/Train/Patched/Images
train_mask_dir: /Potato_Weed_Dataset/Train/Patched/Masks
val_image_dir: /Potato_Weed_Dataset/Val/Patched/Images
val_mask_dir: /Potato_Weed_Dataset/Val/Patched/Masks
test_image_dir: /Potato_Weed_Dataset/Test/Patched/Images
test_mask_dir: /Potato_Weed_Dataset/Test/Patched/Masks
output_dir: results/potatoweed
